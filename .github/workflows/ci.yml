name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-js:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install dependencies
      run: cd JSGame && npm install
    - name: Run ESLint
      run: cd JSGame && npm run lint
    - name: Run tests
      run: cd JSGame && npm test

  test-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Run Pylint
      run: |
        pylint PythonGame/*.py Game/*.py
    - name: Run tests
      run: |
        cd PythonGame && python -m unittest discover .
        cd ../Game && python -m unittest discover .